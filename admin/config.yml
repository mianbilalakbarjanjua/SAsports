# =====================================================================
#  SA Sports - admin panel settings (Sveltia CMS)
#  ONLY EDIT THE TWO LINES MARKED  <<< CHANGE THIS
# =====================================================================
backend:
  name: github
  repo: mianbilalakbarjanjua/SAsports
  branch: main                                  # the branch your GitHub Pages site is published from
  # If you use the Cloudflare login worker (recommended for the owner), remove the # below
  # and put your worker address.  If you use a personal access token, leave it as it is.
  # base_url: https://YOUR-WORKER-NAME.YOUR-ACCOUNT.workers.dev   # <<< CHANGE THIS (only for the worker method)

site_url: https://www.sasports.store
display_url: https://www.sasports.store
logo_url: https://www.sasports.store/img/logo.png

# Photos uploaded in the panel go into the "img" folder, the same place as the existing product photos.
media_folder: img
public_folder: /img

# Every uploaded photo is automatically shrunk to at most 1400 pixels and converted to WebP,
# so the website stays fast even if the owner uploads a large photo from the phone camera.
media_libraries:
  default:
    config:
      max_file_size: 15728640        # 15 MB upload limit before shrinking
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 1800
          height: 1800

collections:
  - name: home
    label: "Homepage / ہوم پیج"
    files:
      - name: home
        label: "Homepage content / ہوم پیج کا مواد"
        file: home.json
        format: json
        fields:
          - { label: "Top bar messages / اوپر کی پٹی کے پیغامات", name: announcements, widget: list, field: { label: "Message", name: m, widget: string } }
          - label: "Hero slides (big pictures or videos) / بڑی تصاویر یا ویڈیو"
            name: slides
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Picture (desktop) / تصویر", name: image, widget: image, required: false }
              - { label: "Picture (mobile, tall) / موبائل کی تصویر", name: mobile_image, widget: image, required: false }
              - { label: "Video (mp4, under 15 MB) / ویڈیو", name: video, widget: file, required: false, hint: "If a video is added it plays instead of the picture. Keep it short and compressed. / مختصر اور چھوٹی ویڈیو" }
              - { label: "Big heading / عنوان", name: title, widget: string, required: false }
              - { label: "Link (for example bats/) / لنک", name: link, widget: string, required: false }
          - label: "Shop by collection tiles / کلیکشن ٹائلز"
            name: collections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title / نام", name: title, widget: string }
              - { label: "Picture / تصویر", name: image, widget: image }
              - { label: "Link (for example pads/) / لنک", name: link, widget: string }
          - { label: "Players section title / کھلاڑیوں والے حصے کا عنوان", name: trusted_title, widget: string, required: false }
          - label: "Players / customers pictures / کھلاڑیوں کی تصاویر"
            name: trusted
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Picture / تصویر", name: image, widget: image }
              - { label: "Caption / کیپشن", name: caption, widget: string, required: false }
          - { label: "About title / ہمارے بارے میں عنوان", name: about_title, widget: string }
          - { label: "About text / ہمارے بارے میں متن", name: about_text, widget: text }
          - { label: "About picture / تصویر", name: about_image, widget: image, required: false }
          - { label: "Videos section title / ویڈیو والے حصے کا عنوان", name: videos_title, widget: string, required: false }
          - label: "Vertical videos (or pictures) / عمودی ویڈیوز"
            name: videos
            widget: list
            fields:
              - { label: "Video (mp4) or picture / ویڈیو یا تصویر", name: file, widget: file, hint: "Tall 9:16 videos look best, under 15 MB each. / ۱۵ ایم بی سے کم" }
          - label: "Gallery strip (black band) / گیلری"
            name: gallery
            widget: list
            fields:
              - { label: "Picture / تصویر", name: image, widget: image }

  - name: shop
    label: "Products / پروڈکٹس"
    files:
      - name: products
        label: "All Products / تمام پروڈکٹس"
        file: products.json
        format: json
        fields:
          - label: "Products / پروڈکٹس"
            name: products
            widget: list
            label_singular: "product"
            summary: "{{fields.name}}  -  Rs {{fields.price}}"
            fields:
              - { label: "Product name / پروڈکٹ کا نام", name: name, widget: string }
              - label: "Category / کیٹیگری"
                name: category
                widget: select
                options:
                  - { label: "Bats / بلے", value: bats }
                  - { label: "Pads / پیڈز", value: pads }
                  - { label: "Gloves / گلوز", value: gloves }
                  - { label: "Balls / گیندیں", value: balls }
                  - { label: "Helmets & Guards / ہیلمٹ اور گارڈز", value: protect }
                  - { label: "Bags & Kits / بیگ اور کِٹس", value: kits }
              - label: "Sub-category / ذیلی کیٹیگری"
                name: sub
                widget: select
                hint: "Choose the one that matches the category. Bats: Premium or Classic. Pads: Classic, Colour or Limited. Gloves: Wicketkeeping or Batting. Balls: Match or Practice. Helmets & Guards: Helmets or Guards. Bags & Kits: Kit Bags, Full Kits or Accessories."
                options: [Premium, Classic, Colour, Limited, Wicketkeeping, Batting, Match, Practice, Helmets, Guards, Kit Bags, Full Kits, Accessories]
              - { label: "Price in Rs / قیمت (روپے)", name: price, widget: number, value_type: int, min: 0 }
              - { label: "Stock / سٹاک کی تعداد", name: stock, widget: number, value_type: int, min: 0, required: false, hint: "How many pieces are left. 0 = shows Sold out. Leave empty = do not show stock. 10 or fewer = shows Only X left. / خالی چھوڑیں تو سٹاک نہیں دکھے گا۔ ۰ لکھیں تو Sold out۔" }
              - { label: "Photo / تصویر", name: image, widget: image, hint: "One clear photo, ideally with a plain background. It is shrunk automatically. / ایک صاف تصویر، سادہ پس منظر بہتر ہے۔" }
              - { label: "Description / تفصیل", name: description, widget: text, hint: "One or two short lines. / ایک دو مختصر لائنیں۔" }
              - { label: "Size / سائز (e.g. Full Size, 26 inch)", name: size, widget: string, required: false }
              - { label: "Key features, one per line / خاص باتیں", name: features, widget: list, required: false, field: { label: "Feature / خوبی", name: f, widget: string }, hint: "e.g. Sheep leather, Full protection, International standards. / ہر خوبی الگ لائن میں" }
              - label: "Choices for the customer / گاہک کے آپشنز"
                name: options
                widget: list
                required: false
                label_singular: "option"
                summary: "{{fields.name}}"
                hint: "Add an option such as Hand with choices Left and Right. Add as many as you need (Size, Colour, Weight...). / مثلاً Hand: Left, Right"
                fields:
                  - { label: "Option name / آپشن کا نام", name: name, widget: string }
                  - { label: "Choices / انتخابات", name: values, widget: list, field: { label: "Choice", name: v, widget: string } }
              - { label: "Old price (for Sale badge) / پرانی قیمت", name: old_price, widget: number, value_type: int, min: 0, required: false, hint: "Higher than price = shows a Sale badge with this price crossed out. / قیمت سے زیادہ لکھیں تو سیل کا نشان آئے گا۔" }
              - { label: "Show in Bestseller / بیسٹ سیلر میں دکھائیں", name: bestseller, widget: boolean, default: false }
              - { label: "Show in New Launches / نئی لانچ میں دکھائیں", name: new_launch, widget: boolean, default: false }
              - { label: "Hide from website / سائٹ سے چھپائیں", name: hidden, widget: boolean, default: false, hint: "Switch on to hide this product without deleting it. / بغیر ڈیلیٹ کیے چھپانے کے لیے آن کریں۔" }

  - name: more
    label: "Reviews & Settings / ریویو اور ترتیبات"
    files:
      - name: reviews
        label: "Customer Reviews / گاہکوں کی رائے"
        file: reviews.json
        format: json
        fields:
          - label: "Reviews (add only REAL reviews from real customers) / صرف اصلی گاہکوں کی اصلی رائے ڈالیں"
            name: reviews
            widget: list
            label_singular: "review"
            summary: "{{fields.name}}  -  {{fields.rating}} stars"
            fields:
              - { label: "Customer name / گاہک کا نام", name: name, widget: string }
              - { label: "City / شہر", name: city, widget: string, required: false }
              - { label: "Rating 1 to 5 / ستارے", name: rating, widget: number, value_type: int, min: 1, max: 5 }
              - { label: "Review / رائے", name: text, widget: text }
      - name: custom
        label: "Custom bat form / کسٹم بیٹ فارم"
        file: custom.json
        format: json
        fields:
          - { label: "Base price in Rs / بنیادی قیمت", name: base_price, widget: number, value_type: int, min: 0 }
          - { label: "Note shown under the form / فارم کے نیچے نوٹ", name: note, widget: string, required: false }
          - label: "Bat grades and price added / گریڈ اور اضافی قیمت (minus allowed)"
            name: grades
            widget: list
            summary: "{{fields.name}}  {{fields.add}}"
            fields:
              - { label: "Grade name / گریڈ", name: name, widget: string }
              - { label: "Price added to base (Rs) / اضافہ", name: add, widget: number, value_type: int }
          - label: "Optional extras / اضافی چیزیں"
            name: extras
            widget: list
            summary: "{{fields.name}}  {{fields.price}}"
            fields:
              - { label: "Extra / چیز", name: name, widget: string }
              - { label: "Price (Rs) / قیمت", name: price, widget: number, value_type: int, min: 0 }
      - name: pages
        label: "Page texts & policies / صفحات کا متن"
        file: pages.json
        format: json
        fields:
          - label: "Track order page / ٹریک صفحہ"
            name: track
            widget: object
            collapsed: true
            fields:
              - { label: "Heading / عنوان", name: title, widget: string }
              - { label: "Intro line / تعارف", name: intro, widget: string, required: false }
              - { label: "Note at bottom / نیچے کا نوٹ", name: note, widget: string, required: false }
          - label: "Wholesale page / تھوک صفحہ"
            name: wholesale
            widget: object
            collapsed: true
            fields:
              - { label: "Heading / عنوان", name: title, widget: string }
              - { label: "Intro line / تعارف", name: intro, widget: string, required: false }
          - label: "Return policy / واپسی پالیسی"
            name: returns
            widget: object
            collapsed: true
            fields:
              - { label: "Heading / عنوان", name: title, widget: string }
              - { label: "Intro line / تعارف", name: intro, widget: string, required: false }
              - { label: "Text (## = heading, - = bullet, blank line = new paragraph)", name: body, widget: text }
          - label: "Shipping policy / شپنگ پالیسی"
            name: shipping
            widget: object
            collapsed: true
            fields:
              - { label: "Heading / عنوان", name: title, widget: string }
              - { label: "Intro line / تعارف", name: intro, widget: string, required: false }
              - { label: "Text (## = heading, - = bullet, blank line = new paragraph)", name: body, widget: text }
          - label: "Privacy policy / پرائیویسی پالیسی"
            name: privacy
            widget: object
            collapsed: true
            fields:
              - { label: "Heading / عنوان", name: title, widget: string }
              - { label: "Intro line / تعارف", name: intro, widget: string, required: false }
              - { label: "Text (## = heading, - = bullet, blank line = new paragraph)", name: body, widget: text }
      - name: payments
        label: "Payment methods / ادائیگی کے طریقے"
        file: payments.json
        format: json
        fields:
          - { label: "Cash on delivery / کیش آن ڈیلیوری", name: cod, widget: boolean, default: true }
          - { label: "Cash on delivery text / متن", name: cod_label, widget: string, required: false }
          - { label: "International orders on WhatsApp / بیرون ملک آرڈر", name: international, widget: boolean, default: true }
          - { label: "Accept Visa / Mastercard debit cards / ڈیبٹ کارڈ پیمنٹ", name: card_enabled, widget: boolean, default: false, hint: "Turn on only after you have a card payment page from a Pakistani payment gateway. / پہلے گیٹ وے کا پیمنٹ پیج لنک ڈالیں۔" }
          - { label: "Card payment page link (https://...) / کارڈ پیمنٹ کا لنک", name: card_link, widget: string, required: false, hint: "The payment page or payment link your gateway gives you. / آپ کے گیٹ وے کا دیا ہوا لنک" }
          - { label: "Card payment note / کارڈ پیمنٹ کی ہدایت", name: card_note, widget: text, required: false }
          - { label: "Instructions shown to the customer / ہدایات", name: instructions, widget: text, required: false }
          - label: "Accounts / اکاؤنٹس (empty ones are hidden / خالی چھپے رہیں گے)"
            name: methods
            widget: list
            summary: "{{fields.type}}  {{fields.number}}"
            fields:
              - { label: "Type / قسم", name: type, widget: select, options: ["JazzCash", "Easypaisa", "Bank Account", "SadaPay", "NayaPay", "Raast"] }
              - { label: "Account title (name) / اکاؤنٹ ٹائٹل", name: account_title, widget: string, required: false }
              - { label: "Mobile wallet number or bank account number / نمبر", name: number, widget: string, required: false }
              - { label: "Bank name (banks only) / بینک کا نام", name: bank_name, widget: string, required: false }
              - { label: "IBAN (optional) / آئی بین", name: iban, widget: string, required: false }
              - { label: "Show this account / دکھائیں", name: enabled, widget: boolean, default: true }
      - name: settings
        label: "Settings / ترتیبات"
        file: settings.json
        format: json
        fields:
          - { label: "Phone number shown in footer / فون نمبر", name: phone_display, widget: string, required: false }
          - { label: "WhatsApp number, digits only (923001234567) / واٹس ایپ نمبر", name: whatsapp, widget: string, required: false, pattern: ["^[0-9]{8,15}$", "Digits only, with country code, no + or spaces"] }
          - { label: "Footer text / فُوٹر کا متن", name: footer_note, widget: string, required: false }
          - { label: "Google title (home page) / سرچ ٹائٹل", name: seo_title, widget: string, required: false }
          - { label: "Google description (home page) / سرچ تفصیل", name: seo_description, widget: text, required: false }
          - { label: "Value of Rs 1 in US dollars (for example 0.0036) / ایک روپے کے کتنے ڈالر", name: usd, widget: number, value_type: float, step: 0.0001 }
          - { label: "Value of Rs 1 in British pounds (for example 0.0027) / ایک روپے کے کتنے پاؤنڈ", name: gbp, widget: number, value_type: float, step: 0.0001 }
          - { label: "Value of Rs 1 in euros (for example 0.0031) / ایک روپے کے کتنے یورو", name: eur, widget: number, value_type: float, step: 0.0001 }
          - { label: "Wholesale note shown on the wholesale page / تھوک صفحے کا نوٹ", name: wholesale_note, widget: text }
